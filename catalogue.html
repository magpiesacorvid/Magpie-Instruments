<script>
const ul=document.getElementById("list");
[...instruments].sort((a,b)=>a.name.localeCompare(b.name)).forEach(it=>{
  const li=document.createElement("li");const a=document.createElement("a");
  a.href="instrument.html?id="+encodeURIComponent(it.id);a.textContent=it.name;
  const s=document.createElement("span");s.className="small";s.textContent=" - "+it.region;
  li.append(a,s);ul.append(li);
});
</script>
